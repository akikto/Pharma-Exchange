# =============================================================================
# MedLink B2B – Development Docker Compose
# Usage: docker compose -f docker-compose.dev.yml up --build
# =============================================================================

name: medlink-b2b-dev

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: medlink-postgres-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: medlink
      POSTGRES_PASSWORD: medlink
      POSTGRES_DB: medlink_b2b
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - medlink-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medlink -d medlink_b2b"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Backend – hot reload via tsx watch
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    container_name: medlink-backend-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://medlink:medlink@postgres:5432/medlink_b2b?schema=public
      JWT_SECRET: dev-jwt-secret-min-32-characters-long
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_EXPIRES_IN: 30d
      OTP_EXPIRY_MINUTES: 10
      # MSG91 disabled by default in dev; set to true and fill in the auth key
      # to test real SMS delivery. See docs/BL-01-MSG91.md.
      MSG91_ENABLED: ${MSG91_ENABLED:-false}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_SENDER_ID: ${MSG91_SENDER_ID:-}
      MSG91_TEMPLATE_ID: ${MSG91_TEMPLATE_ID:-}
      MSG91_OTP_LENGTH: ${MSG91_OTP_LENGTH:-6}
      CORS_ORIGIN: http://localhost:5173
      LOG_LEVEL: debug
      RUN_MIGRATIONS: "false"
    volumes:
      # Bind-mount source for hot reload (exclude node_modules)
      - ./backend/src:/app/backend/src:ro
      - ./backend/prisma:/app/backend/prisma
      - backend_node_modules:/app/node_modules
      - backend_backend_modules:/app/backend/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - medlink-dev
    command: >
      sh -c "
        npx prisma generate --schema=backend/prisma/schema.prisma &&
        npx prisma db push --schema=backend/prisma/schema.prisma &&
        npm run dev --workspace=backend
      "

  # ---------------------------------------------------------------------------
  # Frontend – Vite dev server with HMR
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    container_name: medlink-frontend-dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_SOCKET_URL: http://localhost:3000
    volumes:
      - ./frontend/src:/app/frontend/src:ro
      - ./frontend/public:/app/frontend/public:ro
      - ./frontend/index.html:/app/frontend/index.html:ro
      - ./frontend/vite.config.ts:/app/frontend/vite.config.ts:ro
      - frontend_node_modules:/app/node_modules
      - frontend_frontend_modules:/app/frontend/node_modules
    depends_on:
      - backend
    networks:
      - medlink-dev

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_dev_data:
  backend_node_modules:
  backend_backend_modules:
  frontend_node_modules:
  frontend_frontend_modules:

# =============================================================================
# Networks
# =============================================================================
networks:
  medlink-dev:
    driver: bridge
