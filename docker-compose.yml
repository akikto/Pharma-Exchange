# =============================================================================
# MedLink B2B – Production Docker Compose
# Usage: docker compose up -d --build
# =============================================================================

name: medlink-b2b

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL – primary relational database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: medlink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-medlink}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-in-production}
      POSTGRES_DB: ${DB_NAME:-medlink_b2b}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medlink-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-medlink} -d ${DB_NAME:-medlink_b2b}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Not exposed externally in production – internal network only

  # ---------------------------------------------------------------------------
  # Backend API – Node.js + Express + Socket.IO
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    container_name: medlink-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-medlink}:${DB_PASSWORD:-change-me-in-production}@postgres:5432/${DB_NAME:-medlink_b2b}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      OTP_EXPIRY_MINUTES: ${OTP_EXPIRY_MINUTES:-10}
      MSG91_ENABLED: ${MSG91_ENABLED:-false}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_SENDER_ID: ${MSG91_SENDER_ID:-}
      MSG91_TEMPLATE_ID: ${MSG91_TEMPLATE_ID:-}
      MSG91_OTP_LENGTH: ${MSG91_OTP_LENGTH:-6}
      MSG91_BASE_URL: ${MSG91_BASE_URL:-https://control.msg91.com/api/v5/otp}
      RAZORPAY_ENABLED: ${RAZORPAY_ENABLED:-false}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_CURRENCY: ${RAZORPAY_CURRENCY:-INR}
      CORS_ORIGIN: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - medlink-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # Security: read-only root filesystem where possible
    read_only: true
    tmpfs:
      - /tmp/medlink:size=64M
    security_opt:
      - no-new-privileges:true
    # Not published externally – accessed via frontend/nginx proxy

  # ---------------------------------------------------------------------------
  # Frontend – Nginx serves PWA + reverse-proxies API & WebSocket
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-MedLink B2B}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    container_name: medlink-frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - medlink-internal
      - medlink-public
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32M
      - /tmp/nginx:size=16M
    security_opt:
      - no-new-privileges:true

# =============================================================================
# Volumes – persistent data
# =============================================================================
volumes:
  postgres_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  # Internal – backend ↔ postgres (not routable from host)
  medlink-internal:
    driver: bridge
    internal: false

  # Public – frontend exposed to host/internet
  medlink-public:
    driver: bridge
