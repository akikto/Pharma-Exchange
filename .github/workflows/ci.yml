name: CI

on:
  push:
    branches: [main, 'cursor/**', 'feature/**']
  pull_request:
    branches: [main]

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run audit:ci
      - run: npm audit --omit=dev || true

  backend:
    runs-on: ubuntu-latest
    needs: [security-audit]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pharma_exchange
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pharma_exchange"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pharma_exchange?schema=public
      JWT_SECRET: ci-jwt-secret-min-32-characters-long
      RATE_LIMIT_MAX: "10000"
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: ci-test@gmail.com
      SMTP_PASS: ci-test-app-password
      MAIL_FROM: "Pharma Exchange <ci-test@gmail.com>"
      # Razorpay is mocked at the SDK layer in tests — no real creds needed.
      RAZORPAY_ENABLED: "true"
      RAZORPAY_KEY_ID: rzp_test_ci_key
      RAZORPAY_KEY_SECRET: ci-razorpay-key-secret
      RAZORPAY_WEBHOOK_SECRET: ci-razorpay-webhook-secret
      RAZORPAY_CURRENCY: INR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - run: npx prisma db push --schema=backend/prisma/schema.prisma
        working-directory: .
      - run: npm run db:seed --workspace=backend
        working-directory: .
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      - name: Prisma validate
        run: npx prisma validate

  frontend:
    runs-on: ubuntu-latest
    needs: [security-audit]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm run lint
        working-directory: .
      - run: npm run build
      - run: npm run test
      - run: npm run test:a11y

  typecheck:
    runs-on: ubuntu-latest
    needs: [security-audit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pharma_exchange
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pharma_exchange"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pharma_exchange?schema=public
      JWT_SECRET: ci-jwt-secret-min-32-characters-long
      RATE_LIMIT_MAX: "10000"
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: ci-test@gmail.com
      SMTP_PASS: ci-test-app-password
      MAIL_FROM: "Pharma Exchange <ci-test@gmail.com>"
      RAZORPAY_ENABLED: "false"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx prisma db push --schema=backend/prisma/schema.prisma
      - run: npm run db:seed --workspace=backend
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173

  smoke:
    runs-on: ubuntu-latest
    needs: [e2e]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pharma_exchange
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pharma_exchange"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pharma_exchange?schema=public
      JWT_SECRET: ci-jwt-secret-min-32-characters-long
      RATE_LIMIT_MAX: "10000"
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: ci-test@gmail.com
      SMTP_PASS: ci-test-app-password
      MAIL_FROM: "Pharma Exchange <ci-test@gmail.com>"
      RAZORPAY_ENABLED: "false"
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx prisma db push --schema=backend/prisma/schema.prisma
      - run: npm run db:seed --workspace=backend
      - run: npm run build --workspace=backend
      - name: Start API server
        run: |
          npm run start --workspace=backend &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/health && break
            sleep 2
          done
      - run: npm run smoke
        env:
          API_BASE: http://localhost:3000

  lighthouse:
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build --workspace=frontend
      - run: npx playwright install --with-deps chromium
      - run: npm run lighthouse:ci

  android-twa:
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0 platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Validate TWA manifest
        run: node twa/scripts/validate-twa-manifest.mjs
      - name: Prepare Android launcher icons
        run: bash twa/scripts/prepare-android-resources.sh
      - name: Configure Android SDK for Gradle
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          echo "sdk.dir=${SDK_DIR}" > twa/android/local.properties
      - name: Build TWA debug APK
        id: build
        working-directory: twa/android
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee ../../gradle-build.log
      - name: Publish Gradle failure excerpt
        if: failure()
        run: |
          {
            echo "### android-twa Gradle failure"
            echo '```'
            tail -120 gradle-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ERR=$(grep -Ei "^(FAILURE:|\* What went wrong:|   > |error:|Caused by:)" gradle-build.log | tail -40 | tr '\n' ' ' | cut -c1-1500 || true)
          echo "::error title=android-twa build failed::${ERR:-see job summary for stacktrace}"
