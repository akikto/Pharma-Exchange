name: CI

on:
  push:
    branches: [main, 'cursor/**', 'feature/**']
  pull_request:
    branches: [main]

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run audit:ci
      - run: npm audit --omit=dev || true

  backend:
    runs-on: ubuntu-latest
    needs: [security-audit]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pharma_exchange
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pharma_exchange"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pharma_exchange?schema=public
      JWT_SECRET: ci-jwt-secret-min-32-characters-long
      RATE_LIMIT_MAX: "10000"
      # MSG91 is mocked at the fetch layer in tests (see tests/setup.ts) — no real credentials needed.
      MSG91_ENABLED: "true"
      MSG91_AUTH_KEY: ci-msg91-auth-key
      MSG91_SENDER_ID: MEDLNK
      MSG91_TEMPLATE_ID: ci-msg91-template
      MSG91_OTP_LENGTH: "6"
      MSG91_BASE_URL: https://control.msg91.com/api/v5/otp
      # Razorpay is mocked at the SDK layer in tests — no real creds needed.
      RAZORPAY_ENABLED: "true"
      RAZORPAY_KEY_ID: rzp_test_ci_key
      RAZORPAY_KEY_SECRET: ci-razorpay-key-secret
      RAZORPAY_WEBHOOK_SECRET: ci-razorpay-webhook-secret
      RAZORPAY_CURRENCY: INR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - run: npx prisma db push --schema=backend/prisma/schema.prisma
        working-directory: .
      - run: npm run db:seed --workspace=backend
        working-directory: .
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      - name: Prisma validate
        run: npx prisma validate

  frontend:
    runs-on: ubuntu-latest
    needs: [security-audit]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm run lint
        working-directory: .
      - run: npm run build
      - run: npm run test

  typecheck:
    runs-on: ubuntu-latest
    needs: [security-audit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pharma_exchange
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pharma_exchange"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pharma_exchange?schema=public
      JWT_SECRET: ci-jwt-secret-min-32-characters-long
      RATE_LIMIT_MAX: "10000"
      MSG91_ENABLED: "false"
      RAZORPAY_ENABLED: "false"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx prisma db push --schema=backend/prisma/schema.prisma
      - run: npm run db:seed --workspace=backend
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173

  smoke:
    runs-on: ubuntu-latest
    needs: [e2e]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pharma_exchange
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pharma_exchange"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pharma_exchange?schema=public
      JWT_SECRET: ci-jwt-secret-min-32-characters-long
      RATE_LIMIT_MAX: "10000"
      MSG91_ENABLED: "false"
      RAZORPAY_ENABLED: "false"
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx prisma db push --schema=backend/prisma/schema.prisma
      - run: npm run db:seed --workspace=backend
      - run: npm run build --workspace=backend
      - name: Start API server
        run: |
          npm run start --workspace=backend &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/health && break
            sleep 2
          done
      - run: npm run smoke
        env:
          API_BASE: http://localhost:3000
